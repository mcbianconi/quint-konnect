# GitHub Actions workflow syntax reference:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
# Publishes annotations/itf/core/ksp to Maven Central via the vanniktech
# gradle-maven-publish-plugin (quintkonnect.publish convention plugin, build-logic/).
# Triggered by pushing a version tag; bump the version in
# build-logic/src/main/kotlin/quintkonnect.kotlin-jvm.gradle.kts to match before tagging
# (see AGENTS.md's Releasing section).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Active LTS schedule: https://github.com/nodejs/Release#release-schedule
          node-version: "24"

      - name: Install quint
        # Pinned: RunConfig.kt/TestConfig.kt build CLI flags (--mbt, --n-traces, --out-itf,
        # --match) against this version's `quint run --help`/`quint test --help`. Bump
        # deliberately and recheck those flags when moving this pin.
        run: npm install -g @informalsystems/quint@0.32.0

      - name: Fetch quint's Rust evaluator
        # `quint run` downloads this binary to ~/.quint on first use, with no lock between
        # processes, and the build runs test classes in parallel forks (maxParallelForks in
        # build-logic's quintkonnect.kotlin-jvm), so two first-time runs could race on that
        # download and one would fail (qk-0lpw). Fetch it once here instead.
        run: |
          cat > "$RUNNER_TEMP/warmup.qnt" <<'EOF'
          module warmup {
            var x: int
            action init = x' = 0
            action step = x' = x
          }
          EOF
          quint run "$RUNNER_TEMP/warmup.qnt" --max-samples 1 --max-steps 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Publish to Maven Central
        # Env names are the vanniktech plugin's ORG_GRADLE_PROJECT_* convention:
        # https://vanniktech.github.io/gradle-maven-publish-plugin/central/#configure-credentials-via-environment-variables
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Generate release notes
        run: git-cliff --latest --strip header -o /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md
          fi
