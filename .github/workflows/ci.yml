# GitHub Actions workflow syntax reference:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Active LTS schedule: https://github.com/nodejs/Release#release-schedule
          node-version: "24"

      - name: Install quint
        # Pinned: RunConfig.kt/TestConfig.kt build CLI flags (--mbt, --n-traces, --out-itf,
        # --match) against this version's `quint run --help`/`quint test --help`. Bump
        # deliberately and recheck those flags when moving this pin.
        run: npm install -g @informalsystems/quint@0.32.0

      - name: Fetch quint's Rust evaluator
        # `quint run` downloads this binary to ~/.quint on first use, with no lock between
        # processes, and the build runs test classes in parallel forks (maxParallelForks in
        # build-logic's quintkonnect.kotlin-jvm), so two first-time runs could race on that
        # download and one would fail (qk-0lpw). Fetch it once here instead.
        run: |
          cat > "$RUNNER_TEMP/warmup.qnt" <<'EOF'
          module warmup {
            var x: int
            action init = x' = 0
            action step = x' = x
          }
          EOF
          quint run "$RUNNER_TEMP/warmup.qnt" --max-samples 1 --max-steps 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Build example
        # A separate Gradle build (example/settings.gradle.kts) applying the plugin like a user
        # project, so the root `build` above doesn't cover it.
        run: ./gradlew -p example build
