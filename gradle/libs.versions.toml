# https://docs.gradle.org/current/userguide/version_catalogs.html
[versions]
# latest stable: https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml
kotlin            = "2.4.20"
# KSP versions independently of Kotlin since 2.3.x; check Kotlin compatibility in release notes
# (https://github.com/google/ksp/releases) and the latest version at
# https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-gradle-plugin/maven-metadata.xml
ksp               = "2.3.12"
# latest stable: https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml
kotlinx-serial    = "1.11.0"
# latest stable 5.x (6.x tracked separately, see qk-pbk2):
# https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-api/maven-metadata.xml
junit5            = "5.14.4"
# latest stable: https://repo1.maven.org/maven2/com/vanniktech/gradle-maven-publish-plugin/maven-metadata.xml
vanniktech-publish = "0.37.0"
# ZacSweers' kotlin-compile-testing fork with KSP2 support; pick the release whose notes
# (https://github.com/ZacSweers/kotlin-compile-testing/releases) match this project's kotlin/ksp
# versions above. Latest version at
# https://repo1.maven.org/maven2/dev/zacsweers/kctfork/core/maven-metadata.xml
kctfork           = "0.14.0"
# latest stable, built against kotlin-stdlib 2.4.20 (matches `kotlin` above):
# https://repo1.maven.org/maven2/com/squareup/kotlinpoet/maven-metadata.xml
kotlinpoet        = "2.4.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serial" }
ksp-api                    = { module = "com.google.devtools.ksp:symbol-processing-api",    version.ref = "ksp" }
junit5-api                 = { module = "org.junit.jupiter:junit-jupiter-api",              version.ref = "junit5" }
junit5-engine              = { module = "org.junit.jupiter:junit-jupiter-engine",           version.ref = "junit5" }
kctfork-core               = { module = "dev.zacsweers.kctfork:core",                       version.ref = "kctfork" }
kctfork-ksp                = { module = "dev.zacsweers.kctfork:ksp",                        version.ref = "kctfork" }
kotlinpoet-ksp             = { module = "com.squareup:kotlinpoet-ksp",                       version.ref = "kotlinpoet" }

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
vanniktech-publish   = { id = "com.vanniktech.maven.publish.base",         version.ref = "vanniktech-publish" }
